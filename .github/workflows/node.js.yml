name: CI/CD Pipeline for Node Microservice

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test || echo "No tests found"

      - name: Build Docker image
        run: docker build -t mini-service .

      - name: Run container (for validation)
        run: |
          docker run -d -p 3000:3000 mini-service
          sleep 5
          curl -f http://localhost:3000 || echo "Container not responding"
